name: PaMCP Experimental Workbench

on:
  push:
    branches: ["research/pamcp-experimental-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[studio,test,experiment]"
      - name: Validate E1-E22 catalog
        run: python -c "import json,pathlib; d=json.loads(pathlib.Path('docs/experiment_design/pamcp_experiments_v1.json').read_text()); assert d['schema_version']=='1.0.0'; assert [x['id'] for x in d['experiments']]==[f'E{i}' for i in range(1,23)]; assert len(d['factorial_design']['cells'])==8; assert all(x['status']=='planned_not_run' for x in d['experiments']); print('catalog validated: 22 experiments, 8 factorial cells')"
      - name: Run new workbench tests
        run: python -m pytest -q tests/test_experiment_catalog.py tests/test_studio_experiments_api.py
      - name: Run existing Studio API tests
        run: python -m pytest -q tests/test_studio_api.py
