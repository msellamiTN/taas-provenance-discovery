name: PaMCP Experimental Workbench

on:
  push:
    branches: ["research/pamcp-experimental-v1", "research/pamcp-multibenchmark-v1"]
  pull_request:
    branches: ["main", "research/pamcp-experimental-v1"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[studio,test,experiment]"
      - name: Validate Colab notebook Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebooks = [Path("notebooks/PaMCP_MultiBenchmark_v1.ipynb"), Path("notebooks/PaMCP_E8_Retrieval_Campaign.ipynb"), Path("notebooks/PaMCP_Core_Protocol_v2.ipynb"), Path("notebooks/PaMCP_Section_A_Preflight.ipynb")]
          for path in notebooks:
              notebook = json.loads(path.read_text())
              assert notebook.get("nbformat") == 4, f"{path}: invalid notebook format"
              code_cells = [cell for cell in notebook["cells"] if cell.get("cell_type") == "code"]
              assert code_cells, f"{path}: notebook contains no code cells"
              for index, cell in enumerate(code_cells):
                  source = "".join(cell.get("source", []))
                  compile(source, f"{path}:code_cell_{index}", "exec")
              print(f"syntax-validated {path}: {len(code_cells)} code cells")
          PY
      - name: Validate E1-E22 and baseline catalogs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          experiments = json.loads(Path("docs/experiment_design/pamcp_experiments_v1.json").read_text())
          baselines = json.loads(Path("docs/experiment_design/pamcp_baselines_v1.json").read_text())
          assert experiments["schema_version"] == "1.0.0"
          assert [x["id"] for x in experiments["experiments"]] == [f"E{i}" for i in range(1, 23)]
          assert len(experiments["factorial_design"]["cells"]) == 8
          benchmark_registry = json.loads(Path("docs/experiment_design/benchmark_registry_v1.json").read_text())
          assert benchmark_registry["schema_version"] == "1.0.0"
          assert len({x["id"] for x in benchmark_registry["datasets"]}) == len(benchmark_registry["datasets"])
          metric_contracts = json.loads(Path("docs/experiment_design/metric_contracts_v2.json").read_text())
          assert metric_contracts["schema_version"] == "1.0.0"
          assert all(x["status"] == "planned_not_run" for x in experiments["experiments"])
          baseline_ids = {x["id"] for x in baselines["baselines"]}
          assert len(baseline_ids) == len(baselines["baselines"])
          missing = {b for e in experiments["experiments"] for b in e.get("baseline_ids", [])} - baseline_ids
          assert not missing, f"Unknown baseline IDs: {sorted(missing)}"
          print(f"validated {len(experiments['experiments'])} experiments and {len(baseline_ids)} baselines")
          PY
      - name: Run PaMCP experiment, baseline and Colab runner tests
        run: |
          python -m pytest -q \
            tests/test_experiment_catalog.py \
            tests/test_studio_experiments_api.py \
            tests/test_experiment_baselines.py \
            tests/test_colab_e1.py \
            tests/test_e2_annotation_prep.py \
            tests/test_e1_protocol_runner.py \
            tests/test_e1_reference_reconciliation.py \
            tests/test_pamcp_benchmark_io.py \
            tests/test_pamcp_benchmark_adapters.py \
            tests/test_mcp_atlas_adapter.py \
            tests/test_toolret_adapter.py \
            tests/test_evaluation_metrics.py \
            tests/test_e8_retrieval_campaign.py \
            tests/test_mcpverse_adapter.py \
            tests/test_declared_effects_are_not_observations.py
      - name: Execute descriptive E1 registry characterization
        run: |
          RUN_ID="E1-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          python experiments/colab/e1_registry_characterization.py --root . --output results/ci --run-id "${RUN_ID}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = f"E1-{os.environ['GITHUB_SHA']}-{os.environ['GITHUB_RUN_ID']}"
          run_dir = Path("results/ci/E1") / run_id
          manifest = json.loads((run_dir / "MANIFEST.json").read_text(encoding="utf-8"))
          summary = json.loads((run_dir / "summary.json").read_text(encoding="utf-8"))
          assert manifest["experiment"]["id"] == "E1"
          assert manifest["experiment"]["catalog_status_before_run"] == "planned_not_run"
          assert summary["registry"]["tool_rows"] > 0
          assert summary["guardrails"]["silver_labels_read"] is False
          assert summary["guardrails"]["task_gold_labels_read"] is False
          assert summary["guardrails"]["mcp_servers_executed"] is False
          print(json.dumps({
              "status": "EXECUTED",
              "run_id": run_id,
              "registry_sha256": manifest["inputs"]["registry_sha256"],
              "tool_rows": summary["registry"]["tool_rows"],
              "unique_tool_ids": summary["registry"]["unique_tool_ids"],
              "source_count": summary["registry"]["source_count"],
              "published_hash_mismatches": summary["metadata_completeness"]["published_hash_mismatches"],
              "artifact_dir": str(run_dir)
          }, indent=2))
          PY
      - name: Upload E1 reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: pamcp-e1-${{ github.sha }}-${{ github.run_id }}
          path: results/ci/E1/E1-${{ github.sha }}-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
      - name: Run existing Studio API tests
        run: python -m pytest -q tests/test_studio_api.py
