name: PaMCP Experimental Workbench

on:
  push:
    branches: ["research/pamcp-experimental-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[studio,test,experiment]"
      - name: Validate E1-E22 catalog
        run: python experiments/catalog_cli.py validate
      - name: Run new workbench tests
        run: python -m pytest -q tests/test_experiment_catalog.py tests/test_studio_experiments_api.py
      - name: Run existing Studio API tests
        run: python -m pytest -q tests/test_studio_api.py
