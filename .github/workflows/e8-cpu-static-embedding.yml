name: E8 CPU Static Embedding

on:
  push:
    branches: ["feature/e8-cpu-fasttext-v2"]
    paths:
      - "experiments/e8_cpu_static_embedding.py"
      - "experiments/e8_retrieval_campaign.py"
      - "src/taas/data/registries.py"
      - "scripts/fetch_mcptoolbenchpp.py"
      - "tests/test_e8_retrieval_campaign.py"
      - "tests/test_fetch_mcptoolbenchpp.py"
      - "tests/test_e8_cpu_static_embedding.py"
      - "notebooks/E8_CPU_StaticEmbedding_v2_Colab.ipynb"
      - "docs/experiment_design/E8_CPU_STATIC_EMBEDDING_v2.json"
      - ".github/workflows/e8-cpu-static-embedding.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "experiments/e8_cpu_static_embedding.py"
      - "tests/test_e8_cpu_static_embedding.py"
      - "notebooks/E8_CPU_StaticEmbedding_v2_Colab.ipynb"
      - "docs/experiment_design/E8_CPU_STATIC_EMBEDDING_v2.json"
      - ".github/workflows/e8-cpu-static-embedding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Validate E8 module and protocol JSON
        run: |
          python -m compileall -q experiments scripts src/taas/data
          python -m json.tool docs/experiment_design/E8_CPU_STATIC_EMBEDDING_v2.json > /dev/null
      - name: Validate E8 Colab notebook structure and Python syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("notebooks/E8_CPU_StaticEmbedding_v2_Colab.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))
          assert notebook.get("nbformat") == 4
          assert len(notebook.get("cells", [])) == 20
          sources = []
          for i, cell in enumerate(notebook["cells"]):
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              # The Colab-only %cd magic is the sole IPython line in this notebook.
              source = "\n".join(
                  line for line in source.splitlines()
                  if not line.lstrip().startswith("%")
              )
              compile(source, f"{path}:cell_{i}", "exec")
              sources.append(source)
          assert any("E8_COLAB_VALIDATION_REVISION = 2026-11-06-r5" in s for s in sources)
          assert any("'--tb=long'" in s and "'-vv'" in s for s in sources)
          assert all("pytest', '-q'" not in s for s in sources)
          print(f"Validated {len(sources)} code cells in {path}")
          PY
      - name: Restore pinned MCPToolBench++ snapshot (integration test)
        run: |
          python scripts/fetch_mcptoolbenchpp.py --raw-root "$RUNNER_TEMP/e8-mcp-data/raw"
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "e8-mcp-data" / "raw"
          manifest = json.loads((root / "MCPTOOLBENCHPP_MANIFEST.json").read_text())
          category_dir = root / "mcptoolbenchpp"
          expected = {"browser", "file_system", "finance", "map", "pay", "search"}
          found = {p.stem for p in category_dir.glob("*.json")}
          assert found == expected, (expected, found)
          assert manifest["revision"] == "2bd35e58ed5ebe79bbb12df0f9919a34ed2cb037"
          assert manifest["tasks"] == 1509
          assert manifest["candidate_tools"] == 87
          assert manifest["servers"] == 10
          print(json.dumps(manifest, indent=2))
          PY
          PYTHONPATH=src python - <<'PY'
          import json
          from pathlib import Path
          from taas.data.registries import load_mcptoolbenchpp
          from experiments.e8_retrieval_campaign import load_mcptoolbenchpp_track

          raw_root = Path(__import__("os").environ["RUNNER_TEMP"]) / "e8-mcp-data" / "raw"
          tools, tasks = load_mcptoolbenchpp(raw_root)
          track = load_mcptoolbenchpp_track(raw_root)
          assert len(tools) == 87, len(tools)
          assert len(tasks) == 1509, len(tasks)
          assert len(track.tasks) > 0
          assert len(track.qrels) == len(track.tasks)
          assert len(track.secondary_qrels) == len(track.tasks)
          print(json.dumps({
              "raw_tools": len(tools),
              "raw_tasks": len(tasks),
              "strict_e8_tasks": len(track.tasks),
              "strict_e8_exclusions": track.exclusions,
          }, indent=2))
          PY
      - name: Run E8 CPU static embedding and retrieval campaign tests
        run: python -m pytest -vv --tb=long -ra tests/test_e8_cpu_static_embedding.py tests/test_e8_retrieval_campaign.py tests/test_fetch_mcptoolbenchpp.py
