name: PaMCP Revision 1 — tests, re-analysis and figures

on:
  push:
    branches:
      - research/pamcp-final-evaluation
    paths:
      - .github/workflows/revision1-evaluate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pamcp-revision1-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PAMCP_RESULTS_DIR: results/revision_1
      PAMCP_REVISION_RESULTS: results/revision_1
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4
        with:
          ref: research/pamcp-final-evaluation
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run repository and Revision 1 tests
        run: |
          python -m pytest -q

      - name: Stage committed baseline results for isolated plotting
        run: |
          mkdir -p results/revision_1
          cp results/final/*.json results/revision_1/
          cat > results/revision_1/INPUT_PROVENANCE.md <<'EOF'
          # Revision 1 plot inputs
          The unchanged E1-E22 JSON inputs in this folder are copies of results/final/*.json
          from the same branch. They are used to regenerate unchanged charts without rewriting
          the frozen reference results. Revision 1 audit JSON files are generated separately.
          The E14 plot is replaced by the Revision 1 scope-aware offline analysis.
          EOF

      - name: Audit machine-label dependency
        run: python experiments/revision_1/audit_label_overlap.py

      - name: Audit model-visible manifest fields
        run: python experiments/revision_1/audit_sanitiser.py

      - name: Reanalyse E14 with scoped effects and task-level inference
        run: python experiments/revision_1/reanalyse_e14_scope_aware.py

      - name: Regenerate all detailed and paper figures
        run: python experiments/revision_1/plot_revision_1.py

      - name: Upload figures and machine-readable results
        uses: actions/upload-artifact@v4
        with:
          name: pamcp-revision1-results-and-figures
          path: results/revision_1/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated Revision 1 results and figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/revision_1/
          if git diff --cached --quiet; then
            echo "No generated result changes to commit."
          else
            git commit -m "Run PaMCP Revision 1 audits and regenerate all figures"
            git push origin HEAD:research/pamcp-final-evaluation
          fi
