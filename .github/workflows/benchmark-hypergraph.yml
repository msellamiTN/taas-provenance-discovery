name: Benchmark hypergraph validation

on:
  push:
    branches:
      - feature/benchmark-capability-hypergraph
      - feature/taas-mcpbench-integration
      - feature/colab-t4-core-studio
  pull_request:
    branches:
      - main
      - feature/benchmark-capability-hypergraph
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,studio]"
      - name: Validate benchmark hypergraph builder
        run: pytest -q tests/test_benchmark_hypergraph.py
      - name: Run full regression suite
        run: pytest -q
      - name: Build hypergraph from the pinned benchmark registry
        run: python scripts/build_benchmark_hypergraph.py --outdir /tmp/taas-benchmark-hypergraph
      - name: Upload benchmark hypergraph bundle
        uses: actions/upload-artifact@v5
        with:
          name: taas-benchmark-capability-hypergraph
          path: /tmp/taas-benchmark-hypergraph/
          if-no-files-found: error
          retention-days: 30
