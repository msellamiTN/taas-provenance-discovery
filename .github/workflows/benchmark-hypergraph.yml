name: Benchmark hypergraph validation

on:
  push:
    branches:
      - feature/benchmark-capability-hypergraph
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Validate benchmark hypergraph builder
        run: pytest -q tests/test_benchmark_hypergraph.py
      - name: Run full regression suite
        run: pytest -q
