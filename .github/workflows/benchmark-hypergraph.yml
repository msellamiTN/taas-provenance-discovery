name: Benchmark hypergraph validation

on:
  push:
    branches:
      - feature/benchmark-capability-hypergraph
      - feature/colab-t4-core-studio
  pull_request:
    branches:
      - main
      - feature/benchmark-capability-hypergraph
  workflow_dispatch:

# Avoid spending runner time on obsolete commits when newer work is pushed.
concurrency:
  group: benchmark-hypergraph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test,studio,experiment]"
      # Run the suite once: the benchmark-specific test is already included.
      - name: Run regression suite
        run: pytest -q
      - name: Build hypergraph from the pinned benchmark registry
        run: python scripts/build_benchmark_hypergraph.py --outdir /tmp/taas-benchmark-hypergraph
      - name: Upload benchmark hypergraph bundle
        uses: actions/upload-artifact@v5
        with:
          name: taas-benchmark-capability-hypergraph
          path: /tmp/taas-benchmark-hypergraph/
          if-no-files-found: error
          retention-days: 30
