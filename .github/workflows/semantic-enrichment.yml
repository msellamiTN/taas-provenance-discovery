name: Semantic enrichment workpack validation

on:
  push:
    branches:
      - feature/semantic-enrichment-pipeline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test blind workpack generator
        run: pytest -q tests/test_semantic_annotation_workpacks.py
      - name: Run regression suite
        run: pytest -q
      - name: Generate eight independent-session workpacks
        run: python scripts/create_semantic_annotation_workpacks.py --outdir /tmp/taas-semantic-workpacks --workers 8
      - name: Upload workpacks and manifest
        uses: actions/upload-artifact@v4
        with:
          name: taas-semantic-annotation-workpacks
          path: /tmp/taas-semantic-workpacks/
          if-no-files-found: error
          retention-days: 30
