name: Verify pinned MCP-Bench patch

on:
  push:
    branches:
      - feature/taas-mcpbench-clean-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-check:
    name: git apply --check (pinned upstream)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out TaaS integration branch
        uses: actions/checkout@v4

      - name: Check out exact pinned MCP-Bench revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Accenture/mcp-bench.git /tmp/mcp-bench
          git -C /tmp/mcp-bench fetch --depth 1 origin 7a8eaeae83a842a2949080acc5473f65e1569daf
          git -C /tmp/mcp-bench checkout --detach 7a8eaeae83a842a2949080acc5473f65e1569daf
          test "$(git -C /tmp/mcp-bench rev-parse HEAD)" = "7a8eaeae83a842a2949080acc5473f65e1569daf"

      - name: Validate patch applicability (no files changed)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mcp-bench
          git apply --check --verbose "$GITHUB_WORKSPACE/integrations/mcp-bench/runner.patch"
          echo "PASS: runner.patch applies cleanly to the exact pinned MCP-Bench revision."
