name: PaMCP Publication Visualization and Experiment Export

on:
  push:
    branches:
      - feature/pamcp-publication-visualization-v1
    paths:
      - "src/taas/experiments/plotting.py"
      - "experiments/plot_results.py"
      - "experiments/e8_retrieval_campaign.py"
      - "experiments/prepare_e8_data.py"
      - "experiments/export_e8_figures.py"
      - "experiments/run_e8_and_plot.sh"
      - "experiments/colab/E8_Retrieval_Campaign.ipynb"
      - "docs/experiment_design/pamcp_plot_plan_v1.json"
      - "docs/experiment_design/pamcp_experiments_v1.json"
      - "docs/experiment_design/pamcp_baselines_v1.json"
      - "tests/test_plotting.py"
      - "tests/test_e8_retrieval_campaign.py"
      - "tests/test_e8_data_preparation.py"
      - "tests/test_e8_figure_export.py"
      - "experiments/export_e9_figures.py"
      - "experiments/prepare_e9_livemcpbench.py"
      - "experiments/e9_retrieval_campaign.py"
      - "experiments/e2/prepare_annotation_tasks.py"
      - "tests/test_e9_figure_export.py"
      - "tests/test_e9_retrieval_campaign.py"
      - "experiments/e3_simulation.py"
      - "tests/test_e3_simulation.py"
      - "docs/experiment_design/E3_SIMULATION_HARNESS.md"
      - "pyproject.toml"
      - ".github/workflows/visualization.yml"
  pull_request:
    paths:
      - "src/taas/experiments/plotting.py"
      - "experiments/plot_results.py"
      - "experiments/e8_retrieval_campaign.py"
      - "experiments/prepare_e8_data.py"
      - "experiments/export_e8_figures.py"
      - "experiments/run_e8_and_plot.sh"
      - "experiments/colab/E8_Retrieval_Campaign.ipynb"
      - "docs/experiment_design/pamcp_plot_plan_v1.json"
      - "docs/experiment_design/pamcp_experiments_v1.json"
      - "docs/experiment_design/pamcp_baselines_v1.json"
      - "tests/test_plotting.py"
      - "tests/test_e8_retrieval_campaign.py"
      - "tests/test_e8_data_preparation.py"
      - "tests/test_e8_figure_export.py"
      - "experiments/export_e9_figures.py"
      - "experiments/prepare_e9_livemcpbench.py"
      - "experiments/e9_retrieval_campaign.py"
      - "experiments/e2/prepare_annotation_tasks.py"
      - "tests/test_e9_figure_export.py"
      - "tests/test_e9_retrieval_campaign.py"
      - "experiments/e3_simulation.py"
      - "tests/test_e3_simulation.py"
      - "docs/experiment_design/E3_SIMULATION_HARNESS.md"
      - "pyproject.toml"
      - ".github/workflows/visualization.yml"

permissions:
  contents: read

jobs:
  validate-plotting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark, visualization and test dependencies
        run: python -m pip install -e ".[benchmark-hf,visualization,test]"
      - name: Validate E1-E22 figure registry
        run: python experiments/plot_results.py validate
      - name: Validate E8 launcher syntax
        run: bash -n experiments/run_e8_and_plot.sh
      - name: Validate E8 Colab notebook JSON
        run: python -m json.tool experiments/colab/E8_Retrieval_Campaign.ipynb > /dev/null
      - name: Prepare E9 LiveMCPBench evaluator-separated reference subset
        run: |
          python experiments/prepare_e9_livemcpbench.py --output /tmp/e9-livemcpbench-prepared
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/e9-livemcpbench-prepared/PREPARATION_MANIFEST.json").read_text())
          counts = manifest["resolution"]
          assert counts["tasks_total"] == 95
          assert counts["tasks_primary_eligible"] == 94
          assert counts["tasks_excluded_no_resolvable_gold"] == 1
          assert counts["tool_mentions_total"] == 256
          assert counts["tool_mentions_unique_identity"] == 222
          assert counts["tool_mentions_ambiguous_identity"] == 29
          assert counts["tool_mentions_unresolved"] == 5
          assert manifest["status"] == "prepared_not_run"
          assert manifest["separation"]["gold_labels_exposed_to_discovery"] is False
          print(json.dumps({
              "E9_LiveMCPBench_preparation": counts,
              "assertion": "94/95 tasks included; ambiguous tool names expand to all candidate identities"
          }, indent=2))
          PY
      - name: Prepare proposed E2 human-annotation sample (not frozen)
        run: |
          python experiments/e2/prepare_annotation_tasks.py \
            --registry data/processed/registry_merged.json \
            --output /tmp/e2-annotation-proposal \
            --sample-size 120 \
            --seed 20261107 \
            --sampling-design stratified_source_category
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/e2-annotation-proposal")
          manifest_path = root / "sample_manifest.json"
          manifest = json.loads(manifest_path.read_text())
          manifest["sample_design_status"] = "proposed_not_frozen"
          manifest["sample_size_rationale"] = {
              "population_tools": 569,
              "confidence_level_reference": 0.95,
              "worst_case_binary_proportion": 0.5,
              "planning_margin_percentage_points": 8,
              "simple_random_finite_population_calculation": "approximately 119; rounded to 120",
              "limitation": "This planning calculation is not a power guarantee for per-class type precision/recall or macro-F1."
          }
          manifest["annotation_release_gate"] = (
              "Do not distribute the sheets or start annotation until the study owner "
              "accepts and freezes sample size, seed, sampling design and scoring rules."
          )
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          proposal = """# E2 proposed sampling design — NOT FROZEN

          - Population: 569 unique tool definitions in the pinned merged registry.
          - Proposed sample: 120 tools.
          - Sampling: proportional stratification by source × source category, with at least one sampled tool in each non-empty stratum.
          - Seed: 20261107.
          - Planning reference: finite-population correction gives approximately 119 tools for a 95% confidence level and ±8 percentage-point margin at worst-case binary proportion 0.5 under simple random sampling; rounded to 120.
          - Limitation: this calculation is not a power analysis for 16-class type macro-F1. Report per-class support and uncertainty; do not claim adequate rare-class power from this calculation.
          - Release gate: this is a proposal. Do not annotate until the study owner freezes the sample parameters and E2 scoring rules. Two distinct human annotators must work independently.
          """
          (root / "E2_SAMPLE_DESIGN_PROPOSAL.md").write_text(proposal)
          checks = {}
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "SHA256SUMS.json":
                  checks[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / "SHA256SUMS.json").write_text(json.dumps(checks, indent=2) + "\n")
          assert manifest["status"] == "prepared_not_run"
          assert manifest["sampled_tool_count"] == 120
          assert manifest["sample_design_status"] == "proposed_not_frozen"
          print(json.dumps({
              "status": manifest["status"],
              "sample_design_status": manifest["sample_design_status"],
              "sampled_tools": manifest["sampled_tool_count"],
              "annotation_units": manifest["annotation_unit_count"],
              "strata": manifest["strata_tool_counts"],
          }, indent=2))
          PY
      - name: Validate E9 retrieval runner syntax
        run: python -m py_compile experiments/e9_retrieval_campaign.py
      - name: Run plotting and E8/E9 regression tests
        run: python -m pytest -q tests/test_plotting.py tests/test_e8_figure_export.py tests/test_e8_retrieval_campaign.py tests/test_e8_data_preparation.py tests/test_e9_figure_export.py tests/test_e9_livemcpbench_preparation.py tests/test_e9_retrieval_campaign.py
      - name: Upload prepared E9 LiveMCPBench dataset package
        uses: actions/upload-artifact@v4
        with:
          name: PaMCP-E9-LiveMCPBench-Prepared
          path: /tmp/e9-livemcpbench-prepared/
          if-no-files-found: error
          retention-days: 30
      - name: Split proposed E2 files into independent annotator and owner packages
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          source = Path("/tmp/e2-annotation-proposal")
          base = Path("/tmp/e2-packages")
          base.mkdir(parents=True, exist_ok=True)
          proposal = (source / "E2_SAMPLE_DESIGN_PROPOSAL.md").read_bytes()

          def create_zip(path, payload):
              checksums = {name: hashlib.sha256(data).hexdigest() for name, data in payload.items()}
              payload = dict(payload)
              payload["SHA256SUMS.json"] = (json.dumps(checksums, indent=2) + "\n").encode()
              with ZipFile(path, "w", ZIP_DEFLATED) as archive:
                  for name, data in payload.items():
                      archive.writestr(name, data)

          for letter in ("A", "B"):
              payload = {
                  f"annotator_{letter}.csv": (source / f"annotator_{letter}.csv").read_bytes(),
                  "E2_SAMPLE_DESIGN_PROPOSAL.md": proposal,
                  "README_FIRST.txt": (
                      f"ANNOTATOR {letter} — PROPOSED, NOT FROZEN\n\n"
                      "Do not start annotation until the study owner formally approves and freezes "
                      "the sample size, seed, sampling design and scoring rules. Work independently. "
                      "Do not view model predictions, silver labels, the other annotator's answers, "
                      "or the restricted mapping. Keep annotation_unit_id unchanged.\n"
                  ).encode(),
              }
              create_zip(base / f"PaMCP-E2-ANNOTATOR-{letter}-PROPOSAL-NOT-FROZEN.zip", payload)

          owner_payload = {
              "restricted_mapping_DO_NOT_DISTRIBUTE.csv": (source / "restricted_mapping.csv").read_bytes(),
              "sample_manifest.json": (source / "sample_manifest.json").read_bytes(),
              "E2_SAMPLE_DESIGN_PROPOSAL.md": proposal,
              "OWNER_README_FIRST.txt": (
                  "OWNER-ONLY CONTROL PACKAGE — DO NOT DISTRIBUTE TO ANNOTATORS.\n"
                  "Contains the restricted annotation-unit-to-tool mapping. Keep it under study-owner "
                  "control until both independent sheets are frozen and submitted. The sample remains "
                  "proposed_not_frozen; accept or amend the design before releasing A/B sheets.\n"
              ).encode(),
          }
          create_zip(base / "PaMCP-E2-OWNER-CONTROL-NOT-FROZEN.zip", owner_payload)
          import zipfile
          paths = {
              "A": base / "PaMCP-E2-ANNOTATOR-A-PROPOSAL-NOT-FROZEN.zip",
              "B": base / "PaMCP-E2-ANNOTATOR-B-PROPOSAL-NOT-FROZEN.zip",
              "OWNER": base / "PaMCP-E2-OWNER-CONTROL-NOT-FROZEN.zip",
          }
          for key, path in paths.items():
              with zipfile.ZipFile(path) as archive:
                  names = set(archive.namelist())
                  assert "SHA256SUMS.json" in names
                  sums = json.loads(archive.read("SHA256SUMS.json"))
                  for name, expected in sums.items():
                      assert hashlib.sha256(archive.read(name)).hexdigest() == expected
                  if key in {"A", "B"}:
                      assert "restricted_mapping_DO_NOT_DISTRIBUTE.csv" not in names
                      assert "restricted_mapping.csv" not in names
                      assert f"annotator_{key}.csv" in names
                  else:
                      assert "restricted_mapping_DO_NOT_DISTRIBUTE.csv" in names
                      assert "annotator_A.csv" not in names and "annotator_B.csv" not in names
              print(path.name, path.stat().st_size, "SHA-256 verified")
          PY
      - name: Upload proposed E2 Annotator A package (no restricted mapping)
        uses: actions/upload-artifact@v4
        with:
          name: PaMCP-E2-ANNOTATOR-A-PROPOSAL-NOT-FROZEN
          path: /tmp/e2-packages/PaMCP-E2-ANNOTATOR-A-PROPOSAL-NOT-FROZEN.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload proposed E2 Annotator B package (no restricted mapping)
        uses: actions/upload-artifact@v4
        with:
          name: PaMCP-E2-ANNOTATOR-B-PROPOSAL-NOT-FROZEN
          path: /tmp/e2-packages/PaMCP-E2-ANNOTATOR-B-PROPOSAL-NOT-FROZEN.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload E2 owner-only control package
        uses: actions/upload-artifact@v4
        with:
          name: PaMCP-E2-OWNER-CONTROL-NOT-FROZEN-RESTRICTED
          path: /tmp/e2-packages/PaMCP-E2-OWNER-CONTROL-NOT-FROZEN.zip
          if-no-files-found: error
          retention-days: 30

      - name: Validate E3 synthetic fixture harness (software-only; not empirical)
        run: |
          python experiments/e3_simulation.py --output /tmp/e3-simulation
          python -m pytest -q tests/test_e3_simulation.py
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/e3-simulation/e3_simulation_manifest.json").read_text())
          assert manifest["status"] == "software_validation_only"
          assert manifest["empirical_evidence"] is False
          assert manifest["live_mcp_calls"] == 0
          assert manifest["fixture_exact_matches"] == manifest["fixture_count"]
          assert "e3_synthetic_fixture_coverage.svg" in {p.name for p in Path("/tmp/e3-simulation").iterdir()}
          print(json.dumps({
              "E3_fixture_validation": manifest["fixture_exact_matches"],
              "fixture_count": manifest["fixture_count"],
              "empirical_evidence": manifest["empirical_evidence"],
              "status": manifest["status"]
          }, indent=2))
          PY
      - name: Upload E3 synthetic fixture validation artifacts (not empirical results)
        uses: actions/upload-artifact@v4
        with:
          name: PaMCP-E3-SYNTHETIC-FIXTURE-VALIDATION-ONLY
          path: /tmp/e3-simulation/
          if-no-files-found: error
          retention-days: 30
