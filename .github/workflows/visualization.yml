name: PaMCP Publication Visualization

on:
  push:
    branches:
      - feature/pamcp-publication-visualization-v1
    paths:
      - "src/taas/experiments/plotting.py"
      - "experiments/plot_results.py"
      - "experiments/e8_retrieval_campaign.py"
      - "experiments/prepare_e8_data.py"
      - "experiments/export_e8_figures.py"
      - "tests/test_e8_retrieval_campaign.py"
      - "tests/test_e8_data_preparation.py"
      - "tests/test_e8_figure_export.py"
      - "docs/experiment_design/pamcp_plot_plan_v1.json"
      - "docs/experiment_design/pamcp_experiments_v1.json"
      - "docs/experiment_design/pamcp_baselines_v1.json"
      - "tests/test_plotting.py"
      - "pyproject.toml"
      - ".github/workflows/visualization.yml"
  pull_request:
    paths:
      - "src/taas/experiments/plotting.py"
      - "experiments/plot_results.py"
      - "docs/experiment_design/pamcp_plot_plan_v1.json"
      - "docs/experiment_design/pamcp_experiments_v1.json"
      - "docs/experiment_design/pamcp_baselines_v1.json"
      - "tests/test_plotting.py"
      - "pyproject.toml"
      - ".github/workflows/visualization.yml"

permissions:
  contents: read

jobs:
  validate-plotting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install visualization and test dependencies
        run: python -m pip install -e ".[visualization,test]"
      - name: Validate E1-E22 figure registry
        run: python experiments/plot_results.py validate
      - name: Run plotting tests
        run: python -m pytest -q tests/test_plotting.py tests/test_e8_retrieval_campaign.py tests/test_e8_data_preparation.py tests/test_e8_figure_export.py
