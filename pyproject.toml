[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taas-provenance-discovery"
version = "0.1.0"
description = "Reference implementation of 'Tool-as-a-Service: Provenance-Aware Tool Discovery for LLM Agents in MCP Ecosystems'"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
llm = ["anthropic>=0.40"]
probe = ["mcp>=1.0"]
studio = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27", "pydantic>=2.6"]
hf = ["torch>=2.2", "transformers>=4.45", "accelerate>=0.34", "safetensors>=0.4", "sentencepiece>=0.2.0", "tiktoken>=0.7"]
mcp = ["mcp>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
